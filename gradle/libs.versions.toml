[versions]
# === 原版版本（与上游 v2.0.1 一致，不传 -P 参数时使用）===
agp = "9.4.1"
android-compileSdk = "37"
android-buildTools = "36.1.0"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-lifecycle = "2.11.0"
compose-bom = "2026.09.00"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
materialKolor = "5.0.1"
concentus = "1.0.2"
haze = "2.0.1"

# === 兼容模式版本（启用: -Pmicyou.androidCompat=true）===
# 兼容 Android 5.0+ (API 21+) 的降级版本
compat-agp = "8.9.1"
compat-android-compileSdk = "36"
compat-android-buildTools = "36.0.0"
compat-android-minSdk = "21"
compat-android-targetSdk = "29"
compat-androidx-activity = "1.8.2"
compat-androidx-core = "1.12.0"
compat-androidx-lifecycle = "2.8.0"
compat-compose-bom = "2024.09.00"
compat-kotlin = "2.1.20"
compat-kotlinx-coroutines = "1.9.0"
compat-kotlinx-datetime = "0.7.1"
compat-ktor = "3.0.3"
compat-kotlinx-serialization = "1.7.3"
compat-materialKolor = "1.7.1"
compat-multidex = "2.0.1"
compat-desugarJdkLibs = "2.1.4"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
materialKolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
concentus = { module = "io.github.jaredmdobson:concentus", version.ref = "concentus" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

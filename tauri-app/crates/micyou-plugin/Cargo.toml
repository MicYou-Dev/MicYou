[package]
name = "micyou-plugin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "MicYou plugin framework: unified plugin abstraction, dual runtime (native cdylib + WASM), DSP node registration and cross-device sync protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.32"
semver = "1"
libloading = "0.9"
wasmi = "2"
micyou-protocol = { version = "2.0.0", path = "../micyou-protocol" }

[dev-dependencies]
# Built before tests run; its cdylib artifact is loaded via libloading
micyou-plugin-fixture-native = { path = "fixtures/native" }
wat = "1.255.0"

[features]
default = []

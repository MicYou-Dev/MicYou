[package]
name = "micyou-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "MicYou command-line interface"

[[bin]]
name = "micyou-cli"
path = "src/main.rs"

[dependencies]
micyou-core = { workspace = true, features = ["headless-host", "vbcable", "web-server"] }
micyou-plugin.workspace = true

clap.workspace = true
log.workspace = true
semver.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
wat.workspace = true
zip.workspace = true

[build-dependencies]
tauri-winres.workspace = true

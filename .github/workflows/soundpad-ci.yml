name: Soundpad Branch CI

# soundpad 分支专用校验（development.yml 只在 main/master/develop 触发，且
# Android 步骤 continue-on-error，无法作为分支门禁）。这里的构建失败即红。

on:
  push:
    branches: [ "soundpad" ]
  pull_request:
    branches: [ "soundpad" ]
  workflow_dispatch:

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Read Version
      id: version
      run: |
        VERSION=$(grep "^project.version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'liberica'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Android Debug
      run: ./gradlew :composeApp:assembleDebug --stacktrace

    - name: Prepare Android Artifact
      run: |
        mkdir -p ci-artifacts
        APK=$(ls composeApp/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
        if [ -z "$APK" ]; then
          echo "::error::No debug APK found"
          exit 1
        fi
        cp "$APK" "ci-artifacts/MicYou-Android-soundpad-${{ steps.version.outputs.version }}-debug.apk"

    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: MicYou-Android-soundpad-debug
        path: ci-artifacts/*.apk
        if-no-files-found: error
